apiVersion: apps/v1
kind: Deployment
metadata:
  name: regression-test-framework
  namespace: debezium-pipeline
  labels:
    app: regression-test-framework
spec:
  replicas: 1
  selector:
    matchLabels:
      app: regression-test-framework
  template:
    metadata:
      labels:
        app: regression-test-framework
    spec:
      containers:
        - name: regression-test-framework
          image: regression-test-framework:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: regression-test-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: regression-test-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: regression-test-framework
  namespace: debezium-pipeline
spec:
  selector:
    app: regression-test-framework
  ports:
    - port: 8085
      targetPort: 8085
  type: ClusterIP
