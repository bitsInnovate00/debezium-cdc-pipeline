spring:
  application:
    name: cdc-regression-test-framework

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:regression_db}
    username: ${POSTGRES_USER:regression}
    password: ${POSTGRES_PASSWORD:regression}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# CDC Regression Framework configuration
cdc:
  kafka:
    topics: >
      debezium.public.reservations,
      debezium.public.flights,
      debezium.public.tickets,
      debezium.public.payments,
      debezium.public.passengers,
      debezium.public.boarding_passes,
      debezium.public.seat_assignments,
      debezium.public.fare_classes

  capture:
    excluded-tables:
      - public.flyway_schema_history
      - public.spring_session
    primary-key-columns:
      public.reservations:    [reservation_id]
      public.flights:         [flight_id]
      public.tickets:         [ticket_id]
      public.payments:        [payment_id]
      public.passengers:      [passenger_id]
      public.boarding_passes: [boarding_pass_id]
      public.seat_assignments:[assignment_id]
      public.fare_classes:    [fare_class_id]
    non-deterministic-columns:
      public.reservations:    [created_at, updated_at, session_token]
      public.flights:         [updated_at]
      public.tickets:         [issued_at, updated_at]
      public.payments:        [created_at, updated_at, gateway_txn_id]
      public.passengers:      [created_at, updated_at]
      public.boarding_passes: [created_at]
      public.seat_assignments:[created_at, updated_at]

  assertion:
    order-mismatch-permitted-tables:
      - public.seat_assignments
    permitted-columns:
      public.payments: [gateway_txn_id, processor_response]

logging:
  level:
    com.debezium.regression: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
